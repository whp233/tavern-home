name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装后端依赖
        run: npm ci

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 后端 typecheck
        run: npm run typecheck

      - name: 后端测试
        run: npm test

      - name: 前端 typecheck
        run: npx tsc --noEmit
        working-directory: frontend
