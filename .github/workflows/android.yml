name: android

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: npm install
        run: npm install

      - name: next build (out/)
        run: npm run build
        env:
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_WORKER_URL || 'https://tavern-home.example.workers.dev' }}
          NEXT_PUBLIC_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_AUTH_TOKEN || 'dev-token' }}

      - name: cap add android (if missing)
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android shell missing gradlew -> npx cap add android"
            npx cap add android
          else
            echo "android shell exists, skip cap add"
          fi
          # re-apply dual-ABI patch if missing (cap may overwrite)
          if ! grep -q "abiFilters 'arm64-v8a'" android/app/build.gradle; then
            echo "apply dual ABI patch: ndk abiFilters + splits"
            python3 - << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text(encoding="utf-8")
          if "abiFilters" not in t:
              t = t.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        ndk {\n            abiFilters 'arm64-v8a', 'armeabi-v7a'\n        }"
              )
          if "splits" not in t:
              t = t.replace(
                  "buildTypes {",
                  "    splits {\n        abi {\n            enable true\n            reset()\n            include 'arm64-v8a', 'armeabi-v7a'\n            universalApk false\n        }\n    }\n\n    buildTypes {"
              )
          p.write_text(t, encoding="utf-8")
          print("patched")
          PY
          fi
          grep -q "abiFilters" android/app/build.gradle && echo "dual ABI OK" || (echo "patch failed"; exit 1)

      - name: cap sync
        run: npx cap sync android

      - name: gradle assembleRelease (dual APK)
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: gradle bundleRelease (AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-dual-abi
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
