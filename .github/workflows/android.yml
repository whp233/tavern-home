name: android

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # NOTE: setup-android@v3 默认 packages 为 "tools platform-tools"，
      # 但 Google 已从 SDK 仓库移除 "tools" 包 -> sdkmanager 退出 1（2026-09-18 起红）。
      # 只装 platform-tools（+ 构建所需 build-tools/platforms 由 Gradle 按需拉取）。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: npm install
        run: npm install

      - name: next build (out/)
        run: npm run build
        env:
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_WORKER_URL || 'https://tavern-home.example.workers.dev' }}
          NEXT_PUBLIC_AUTH_TOKEN: ${{ secrets.NEXT_PUBLIC_AUTH_TOKEN || 'dev-token' }}

      - name: cap add android (if missing)
        run: |
          set -e
          set -x
          echo "PWD=$(pwd) ls frontend:"; ls -la | head -n 50
          if [ ! -f android/gradlew ]; then
            echo "android shell missing gradlew -> npx cap add android"
            npx cap add android
            chmod +x android/gradlew || true
            ls -la android/ | head -n 50
            cat android/capacitor.config.json 2>&1 | head -n 50 || true
          else
            echo "android shell exists, skip cap add"
            ls -la android/ | head -n 50
          fi
          echo "=== android/app/build.gradle head ==="; head -n 100 android/app/build.gradle || true
          if ! grep -q "abiFilters 'arm64-v8a'" android/app/build.gradle; then
            echo "apply dual ABI patch: ndk abiFilters + splits"
            python3 -c "import pathlib; p=pathlib.Path('android/app/build.gradle'); t=p.read_text(encoding='utf-8'); t=t.replace('defaultConfig {','defaultConfig {\n        ndk {\n            abiFilters \'arm64-v8a\', \'armeabi-v7a\'\n        }') if 'abiFilters' not in t else t; t=t.replace('buildTypes {','    splits {\n        abi {\n            enable true\n            reset()\n            include \'arm64-v8a\', \'armeabi-v7a\'\n            universalApk false\n        }\n    }\n\n    buildTypes {') if 'splits' not in t else t; p.write_text(t, encoding='utf-8'); print('patched')"
            echo "=== after patch ==="; head -n 100 android/app/build.gradle || true
          fi
          grep -q "abiFilters" android/app/build.gradle && echo "dual ABI OK" || (echo "patch failed"; cat android/app/build.gradle; exit 1)

      - name: cap sync
        run: |
          set -x
          npx cap sync android
          ls -la android/app/src/main/assets/public/ 2>&1 | head -n 20 || true

      - name: gradle assembleDebug (dual APK)
        working-directory: frontend/android
        run: |
          set -x
          ./gradlew assembleDebug --stacktrace --info | tail -n 200

      - name: gradle bundleDebug (AAB)
        working-directory: frontend/android
        run: |
          set -x
          ./gradlew bundleDebug --stacktrace --info | tail -n 200

      - name: upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-dual-abi
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/debug/*.aab
