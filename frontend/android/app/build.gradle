apply plugin: 'com.android.application'

android {
    namespace "com.tavern.home"
    compileSdk project.ext.compileSdkVersion
    // ndkVersion project.ext.ndkVersion // 若需固定 NDK 版本可启用

    defaultConfig {
        applicationId "com.tavern.home"
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode 1
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ===== task-33 双 ABI 核心配置 =====
        // 同时支持 32 位 armeabi-v7a 与 64 位 arm64-v8a，安装包覆盖新旧机型
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // 按 ABI 分包，产出 app-arm64-v8a-release.apk 与 app-armeabi-v7a-release.apk
    // 若需合一 AAB（含双 ABI）则执行 bundleRelease，Google Play 会按设备分发对应 ABI
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug 保留分包便于真机快速验证
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('src/main/assets/capacitor.config.json')
    defwl = new groovy.json.JsonSlurper().parseText(servicesJSON.text)
    servicesJSON.write(wl.toString())
} catch(Exception ex) {
    logger.warn("capacitor.config.json not found, skipping")
}
